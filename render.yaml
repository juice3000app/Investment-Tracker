# Render Blueprint for live_app (Signal Ledger). Deploy: push this repo to
# GitHub, then in Render click New -> Blueprint and point it at the repo.
# Render reads this file and creates the service below automatically.
#
# The build step only installs Python deps -- it does NOT run Node/npm.
# The frontend (live_app/frontend/) is built locally with `npm run build`
# and its output (live_app/static/) is committed to the repo; see
# live_app/frontend/README.md. This keeps the Render build fast and
# dependency-free on the Node side, at the cost of remembering to rebuild
# and commit before pushing a UI change.
#
# After the first deploy, set the environment variables listed in
# DEPLOYMENT.md under the service's Environment tab (Render doesn't let a
# blueprint commit secrets to the repo, on purpose).
services:
  - type: web
    name: signal-ledger
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # --timeout 240: /api/refresh and /run-daily-job scan the whole ticker
    # universe (~200+ names) one at a time -- gunicorn's default 30s worker
    # timeout can kill that request mid-scan on a slow day, before any of
    # the run's results (or the scan diagnostics) ever get written or
    # returned. 240s gives it room to actually finish.
    #
    # --worker-class gthread --workers 1 --threads 4: a long /api/refresh
    # request must not block Render's own /healthz check, or Render treats
    # the instance as failed and restarts/kills it mid-scan (confirmed live
    # -- a "term" signal arrived ~48s into a scan under a single sync
    # worker). The fix is threads, NOT a second worker process: --workers 2
    # was tried and caused the service to be SIGKILLed (exit 137) -- almost
    # certainly the free tier's memory limit, since a second gunicorn
    # *process* duplicates the entire Python/Flask/pandas/numpy footprint.
    # Threads share one process's memory, so a free thread can answer
    # /healthz while another thread sits blocked on a slow Yahoo Finance
    # call, with no extra memory cost.
    #
    # IMPORTANT: Render does NOT re-read this file's startCommand on a
    # normal redeploy of an existing service (only on first creation from
    # a blueprint) -- if this ever needs to change again, update it
    # directly in the Render dashboard under Settings -> Start Command,
    # not just here.
    startCommand: "gunicorn live_app.server:app --bind 0.0.0.0:$PORT --timeout 240 --worker-class gthread --workers 1 --threads 4"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Secrets (SMTP_*, DIGEST_TO_EMAIL, DASHBOARD_USER, DASHBOARD_PASSWORD,
      # CRON_SECRET) are set manually in the Render dashboard -- see
      # DEPLOYMENT.md. Do not put real credentials in this file.
